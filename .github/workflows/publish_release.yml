name: publish / release

# Triggered by tag/auto through workflow_dispatch, or by manual tag pushes.
# Uses npm OIDC Trusted Publisher; no NPM_TOKEN is required.
#
# npmjs.com trusted publisher:
#   Repository:  vamgan/review-to-rule
#   Workflow:    publish_release.yml
#   Environment: (leave blank)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.3.2)"
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Resolve tag
        id: resolve-tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve-tag.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release gate
        run: npm run release:check

      - name: Resolve dist-tag
        id: dist-tag
        env:
          RELEASE_TAG: ${{ steps.resolve-tag.outputs.tag }}
        run: |
          if [[ "$RELEASE_TAG" == *"-beta."* ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          elif [[ "$RELEASE_TAG" == *"-alpha."* ]]; then
            echo "tag=alpha" >> "$GITHUB_OUTPUT"
          elif [[ "$RELEASE_TAG" == *"-rc."* ]]; then
            echo "tag=rc" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if npm pack "${PACKAGE_NAME}@${PACKAGE_VERSION}" --dry-run --json >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; skipping."
            exit 0
          fi

          if npm dist-tag ls "$PACKAGE_NAME" 2>/dev/null | awk -v version="$PACKAGE_VERSION" '$2 == version { found=1 } END { exit found ? 0 : 1 }'; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published by dist-tag; skipping."
            exit 0
          fi

          echo "Publishing ${PACKAGE_NAME}@${PACKAGE_VERSION}..."
          npm publish --access public --provenance --tag "$DIST_TAG"
